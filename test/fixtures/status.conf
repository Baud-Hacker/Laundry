# Test fixture: replaces the stock nginx default.conf in the decoy and hidden
# backend containers. Serves the mounted site AND exposes /status/<code>
# endpoints so integration tests can assert that any backend status code
# propagates cleanly through the gate (for both the decoy and hidden paths).
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /status/403 { return 403; }
    location = /status/404 { return 404; }
    location = /status/418 { return 418; }
    location = /status/500 { return 500; }
    location = /status/502 { return 502; }
    location = /status/503 { return 503; }

    location / { try_files $uri $uri/ =404; }
}
