# The public-facing site. Looks like an ordinary WordPress host on 443.

# Normal 80 -> 443 redirect (as most real sites do). The gate never processes
# plaintext credentials.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Per-request variables holding the resolved upstreams + their Host (set by Lua).
    set $hidden_upstream "";
    set $hidden_host     "";
    set $decoy_upstream  "";
    set $decoy_host      "";

    # Everything enters here. The access phase is a pure gate: it ALWAYS routes
    # onward via ngx.exec — to a hidden target on valid auth, else to the decoy.
    location / {
        access_by_lua_block {
            require("auth").run()
        }
        # Safety net only — never reached, since run() always ngx.exec()s. Must be
        # a content-phase handler: `return` would run in the earlier rewrite phase
        # and pre-empt the gate.
        content_by_lua_block {
            ngx.exit(444)
        }
    }

    # --- Decoy targets (fall-through for anonymous / invalid requests) --------

    # kind=upstream : proxy the decoy to a remote URL stashed in $decoy_upstream.
    # Host is set to the decoy's own hostname and SNI is sent, so remote HTTPS
    # backends (e.g. https://example.com) serve their normal site.
    location @decoy_upstream {
        internal;
        proxy_pass $decoy_upstream$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host              $decoy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   "";
    }

    # kind=internal : serve the local decoy content (dedicated prefix location so
    # its index redirect never re-enters the gate).
    location /__laundry_decoy/ {
        internal;
        alias /var/www/decoy/;
        index index.html;
    }

    # --- Hidden targets (reached only via ngx.exec from a valid credential) ---

    # kind=upstream : proxy to an arbitrary URL stashed in $hidden_upstream.
    location @hidden_upstream {
        internal;
        include /etc/nginx/conf.d/anticache.inc;
        proxy_pass $hidden_upstream$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host              $hidden_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # kind=internal, target=site : serve local hidden content on the same box.
    # A dedicated prefix location (out-ranks `location /`), so its index/try_files
    # internal redirect stays here and never re-runs the access phase.
    location /__laundry_site/ {
        internal;
        include /etc/nginx/conf.d/anticache.inc;
        alias /var/www/hidden/;
        index index.html;
    }
}
