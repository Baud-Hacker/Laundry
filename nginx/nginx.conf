user  nobody;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

# Pass these through to worker processes so config.lua (os.getenv) can read them.
env LAUNDRY_DB;
env LAUNDRY_SERVER_KEY;
env LAUNDRY_SERVER_KEY_FILE;
env LAUNDRY_REFRESH_INTERVAL;
env LAUNDRY_FLUSH_INTERVAL;
env LAUNDRY_TIMING_FLOOR_MS;
env LAUNDRY_TIMING_JITTER_MS;
env LAUNDRY_SERVER_HEADER;
env LAUNDRY_DECOY_KIND;
env LAUNDRY_DECOY_TARGET;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # --- Stealth: present exactly as stock nginx -----------------------------
    # OpenResty otherwise advertises "Server: openresty". Override the Server
    # header on EVERY response (decoy, hidden, redirects, errors) from the
    # env-driven config value, so it is uniform and identifies as plain nginx.
    server_tokens off;
    header_filter_by_lua_block {
        ngx.header["Server"] = require("config").get().server_header
    }

    sendfile        on;
    keepalive_timeout  65;

    log_format  main  '$remote_addr - - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    # --- laundry wiring --------------------------------------------------
    lua_package_path "/opt/laundry/lua/?.lua;;";

    lua_shared_dict laundry_creds    10m;  # psk_index -> cred json
    lua_shared_dict laundry_conn      5m;  # connection log queue
    lua_shared_dict laundry_abuse     5m;  # invalid-attempt counters
    lua_shared_dict laundry_verified  1m;  # one-time Argon2id verify cache

    init_worker_by_lua_block {
        require("auth").init_worker()
    }

    # DNS resolver for variable proxy_pass to remote decoy/hidden upstreams.
    # Written per-environment (Docker: 127.0.0.11; bare-metal: a real resolver)
    # by the entrypoint / installer, so it is not hardcoded here.
    include /etc/nginx/conf.d/*.conf;
}
