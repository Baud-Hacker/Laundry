services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - decoy
      - hidden
    environment:
      LAUNDRY_DB: /etc/laundry/laundry.db
      # Demo pepper. In production use LAUNDRY_SERVER_KEY_FILE with a real secret.
      LAUNDRY_SERVER_KEY: "demo-pepper-change-me-0123456789abcdef"
      LAUNDRY_TIMING_FLOOR_MS: "40"
      LAUNDRY_TIMING_JITTER_MS: "15"
      LAUNDRY_SEED_TEST_CREDS: "1"
      LAUNDRY_SERVER_HEADER: "nginx"
      # Decoy runs as a remote upstream (the decoy container). Switch to
      # LAUNDRY_DECOY_KIND=internal to serve the local /var/www/decoy mount instead.
      LAUNDRY_DECOY_KIND: "upstream"
      LAUNDRY_DECOY_TARGET: "http://decoy:80"
    volumes:
      - shared:/shared
      - ../hidden:/var/www/hidden:ro    # internal-route content, served locally
      - ../decoy:/var/www/decoy:ro      # local-decoy content (LAUNDRY_DECOY_KIND=internal)
    ports:
      - "8080:80"
      - "8443:443"

  # The public decoy — a plain, innocuous site (stands in for WordPress).
  decoy:
    image: nginx:alpine
    volumes:
      - ../decoy:/usr/share/nginx/html:ro
      - ../test/fixtures/status.conf:/etc/nginx/conf.d/default.conf:ro

  # The hidden backend reached by the "upstream" route.
  hidden:
    image: nginx:alpine
    volumes:
      - ../hidden:/usr/share/nginx/html:ro
      - ../test/fixtures/status.conf:/etc/nginx/conf.d/default.conf:ro

  # One-shot integration test runner (profile "test").
  tests:
    image: alpine:3.20
    profiles: ["test"]
    depends_on:
      - gateway
    volumes:
      - shared:/shared
      - ../test/integration:/tests:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl bash >/dev/null && bash /tests/run.sh"]

volumes:
  shared:
